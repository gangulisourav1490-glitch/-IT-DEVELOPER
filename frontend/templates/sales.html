{% extends "base.html" %}
{% block title %}Sales{% endblock %}

{% block content %}
<h2>Sales History</h2>

<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search product...">
    <input type="date" id="dateFilter">
    <button onclick="loadSales()">Filter</button>
</div>


<div class="table-container">
    <table id="salesTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Total Price</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody></tbody>

    
</table>
</div>

<h3>Total Sales: ₹ <span id="totalSales">0</span></h3>
<canvas id="salesChart" height="100"></canvas>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let chartInstance = null;

async function loadSales() {
    const res = await fetch("/api/get_sales");
    const data = await res.json();

    const search = document.getElementById("searchInput").value.toLowerCase();
    const date = document.getElementById("dateFilter").value;
    const tbody = document.querySelector("#salesTable tbody");
    tbody.innerHTML = "";

    let total = 0;
    let dailySales = {};

    data.forEach(s => {
        if (search && !s.product_name.toLowerCase().includes(search)) return;
        if (date && s.date !== date) return;
        total += s.total_price;
        if (!dailySales[s.date]) dailySales[s.date] = 0;
        dailySales[s.date] += s.total_price;

        tbody.innerHTML += `<tr>
            <td>${s.id}</td>
            <td>${s.product_name}</td>
            <td>${s.quantity}</td>
            <td>${s.total_price}</td>
            <td>${s.date}</td>
        </tr>`;
    });

    document.getElementById("totalSales").innerText = total;
    createChart(dailySales);
}

function createChart(dataObj) {
    const ctx = document.getElementById("salesChart").getContext("2d");
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: "line",
        data: { labels: Object.keys(dataObj), datasets: [{ label: "Daily Sales", data: Object.values(dataObj), fill: false, tension: 0.3 }] }
    });
}

window.onload = loadSales;
</script>
{% endblock %}
