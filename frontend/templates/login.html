<!DOCTYPE html>
<html>
<head>
    <title>Inventory Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 🌲 Background Image + Animation */
       body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center/cover;
    z-index: -2;
    animation: zoomBg 20s infinite alternate ease-in-out;
}

        @keyframes zoomBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* 🌫️ Dark Overlay */
        body::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        /* 🧊 Glass Box */
        .login-box {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;

            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);

            animation: fadeIn 1s ease forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: white;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;

            background: rgba(255,255,255,0.2);
            color: white;
            transition: 0.3s;
        }

        .login-box input::placeholder {
            color: #ddd;
        }

        .login-box input:focus {
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(0,150,255,0.8);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            background: linear-gradient(45deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;

            transition: 0.3s;
        }

        .login-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,150,255,0.8);
        }

        .login-box button:active {
            transform: scale(0.95);
        }

        /* ✨ Floating Light Effect */
        .light {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,150,255,0.4), transparent);
            border-radius: 50%;
            filter: blur(50px);
            animation: float 10s infinite alternate ease-in-out;
        }

        .light:nth-child(1) {
            top: 10%;
            left: 20%;
        }

        .light:nth-child(2) {
            bottom: 10%;
            right: 20%;
            animation-delay: 3s;
        }

        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(50px); }
        }

    </style>
</head>

<body>

<div class="light"></div>
<div class="light"></div>

<div class="login-box">
    <h2>Inventory Login</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="login()">Login</button>
</div>

<script>
async function login() {
    const btn = document.querySelector("button");
    btn.innerText = "Loading...";
    btn.disabled = true;

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.error) {
            alert(data.error);
            btn.innerText = "Login";
            btn.disabled = false;
            return;
        }

        btn.innerText = "Success!";
        btn.style.background = "green";

        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 800);

    } catch (err) {
        alert("Server error");
        btn.innerText = "Login";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
